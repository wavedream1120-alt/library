<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_9 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_9" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_9');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const container = document.querySelector('#threejs-container');
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(5, 5, 5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

// Create RFID Pad (Base)
const padGeometry = new THREE.BoxGeometry(4, 0.2, 4);
const padMaterial = new THREE.MeshPhongMaterial({ color: 0x22d3ee, transparent: true, opacity: 0.2 });
const pad = new THREE.Mesh(padGeometry, padMaterial);
pad.position.y = -0.5;
scene.add(pad);

// Pad Edge Glow
const edgeGeo = new THREE.EdgesGeometry(padGeometry);
const edgeMat = new THREE.LineBasicMaterial({ color: 0x22d3ee, linewidth: 2 });
const wireframe = new THREE.LineSegments(edgeGeo, edgeMat);
wireframe.position.y = -0.5;
scene.add(wireframe);

// Books Array
const books = [];
const bookColors = [0x10b981, 0x0ea5e9, 0x6366f1];

function createBook(index) {
    const geometry = new THREE.BoxGeometry(1.2, 0.3, 1.8);
    const material = new THREE.MeshPhongMaterial({ color: bookColors[index % bookColors.length] });
    const book = new THREE.Mesh(geometry, material);
    
    // Initial position above the pad
    book.position.set((Math.random() - 0.5) * 2, 5 + index * 2, (Math.random() - 0.5) * 2);
    book.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
    
    scene.add(book);
    return {
        mesh: book,
        targetY: -0.3 + (index * 0.35),
        speed: 0.1 + Math.random() * 0.05,
        settled: false
    };
}

// Spawn initial books
for(let i = 0; i < 3; i++) {
    books.push(createBook(i));
}

function animate() {
    requestAnimationFrame(animate);
    
    books.forEach(book => {
        if (!book.settled) {
            book.mesh.position.y -= book.speed;
            book.mesh.rotation.x *= 0.98;
            book.mesh.rotation.y *= 0.98;
            book.mesh.rotation.z *= 0.98;
            
            if (book.mesh.position.y <= book.targetY) {
                book.mesh.position.y = book.targetY;
                book.mesh.rotation.set(0, (Math.random() - 0.5) * 0.5, 0);
                book.settled = true;
                
                // Visual feedback on impact
                padMaterial.opacity = 0.5;
                setTimeout(() => padMaterial.opacity = 0.2, 200);
            }
        }
    });

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_9 -->


</body></html>
